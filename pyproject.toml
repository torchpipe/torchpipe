[project]
name = "omniback"
dynamic = ["version"]
description = "A flexible and efficient inference framework"
authors = [{ name = "TorchPipe Team" }]
readme = "README.md"
license = { text = "Apache 2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = ["machine learning", "inference"]
requires-python = ">=3.8"

dependencies = [
    "apache-tvm-ffi==0.1.11",
    "fire",
    "tomli>=1.2.3; python_version < '3.11'",
    "ninja",
]

[project.scripts]
omniback = "omniback.commands:main"

[project.urls]
Homepage = "https://github.com/torchpipe/torchpipe"
Documentation = "https://torchpipe.github.io/torchpipe/"
Repository = "https://github.com/torchpipe/torchpipe.git"
"Bug Tracker" = "https://github.com/torchpipe/torchpipe/issues"

[build-system]
requires = ["scikit-build-core>=0.11.0", "apache-tvm-ffi","setuptools-scm", "packaging>=25.0", 'ninja', 'cmake', 'patchelf']
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# the wheel is abi agnostic
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.py-api = "py3"

wheel.packages = ["python/omniback"]
# The install dir matches the import name
wheel.install-dir = "omniback"
wheel.exclude = []


minimum-version = "build-system.requires"
ninja.version = ">=1.11"
ninja.make-fallback = false


# Build configuration
build-dir = "build"


build.verbose = true

# CMake configuration
cmake.version = "CMakeLists.txt"
cmake.build-type = "RelWithDebInfo"
cmake.define.USE_CXX11_ABI = { env = "USE_CXX11_ABI" }
cmake.define.BUILD_BOTH_ABIS = { env = "BUILD_BOTH_ABIS" }
cmake.define.SKIP_CMAKE = { env = "SKIP_CMAKE" }

cmake.define.CMAKE_BUILD_PARALLEL_LEVEL = { env = "CMAKE_BUILD_PARALLEL_LEVEL" }

# Logging
logging.level = "INFO"

# Wheel configuration

sdist.include = [
  "python/omniback/_version.py",
  "/python/omniback/**/*.py",
   "/pyproject.toml",
  "/cmake/**/*",
  # "/src/**/*.cpp",
  "/include/**/*",
  "/3rdparty/bs_thread_pool/*.hpp",
  "/3rdparty/spdlog/include/**/*",
  "/3rdparty/tinytoml/*.h",
  # "/plugins/**/*",  
]

sdist.exclude = [
  "**/.git",
  "**/.github",
  "**/__pycache__",
  "**/*.pyc",
  "build",
  "dist",
  "plugins/**/examples/**", 
]

[tool.setuptools_scm]
version_file = "python/omniback/_version.py"
write_to = "python/omniback/_version.py"
fallback_version = "0.0.1-dev"
tag_regex = "^t(.*)"
local_scheme = "no-local-version"
git_describe_command = ["git", "describe", "--tags", "--long", "--match", "t*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = [
  "pytest",
  "numpy",
  "ninja",
  "setuptools",
]

[tool.cibuildwheel]
skip = "*musllinux*"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.14" }