[project]
name = "torchpipe"
version = "0.1.26"

requires-python = ">=3.8"
description = "Serving inside Pytorch"
dependencies = [
    "torch",
    "omniback>=0.1.26",
    "setuptools",
    "packaging",
    "tqdm",
    "requests",
    "ninja",
    "cmake",
    "patchelf",
]

[tool.setuptools]
packages = ["torchpipe"]

[tool.setuptools.package-data]
torchpipe = ["lib/*.so"]
